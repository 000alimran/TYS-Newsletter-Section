<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The YOLO Newsletter</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <img src="TYS_logo_bkash_logo.png" alt="The YOLO Studio Logo">
    <h1>The YOLO Newsletter</h1>
    <p>Stay inspired with curated content from The YOLO Studio!</p>
    <button id="toggle-dark-mode">
      <span class="material-icons">dark_mode</span> Toggle Dark Mode
    </button>
  </header>

  <section class="newsletter-container">
    <h2>Subscribe Now</h2>
    <form id="newsletter-form">
      <input id="email" type="email" placeholder="Enter your email">
      <button type="submit">
        <span class="material-icons">send</span> Subscribe
      </button>
      <p id="success-message" class="hidden">Thanks for subscribing!</p>
    </form>
  </section>

  <section class="testimonial-section">
    <h2>What Our Readers Say</h2>
    <div id="testimonial-container"></div>
    <button id="add-testimonial">
      <span class="material-icons">add</span> Add Testimonial
    </button>
  </section>

  <script src="script.js"></script>
</body>
</html>
