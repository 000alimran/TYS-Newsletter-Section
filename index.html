<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The YOLO Letter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="newsletter-header">
    <img src="TYS logo bkash logo.png" alt="The YOLO Studio Logo">
    <h1>The YOLO Letter</h1>
    <p>Your dose of daily inspiration!</p>
  </header>

  <main>
    <section class="newsletter-container">
      <h2>Subscribe Now</h2>
      <p>Stay updated with the latest news and inspiration.</p>
      <form id="newsletter-form">
        <input type="email" id="email" placeholder="Enter your email" required>
        <button type="submit">Subscribe</button>
      </form>
      <p id="success-message" class="hidden">Thank you for subscribing!</p>
    </section>

    <section class="testimonial-section">
      <h2>What Our Readers Say</h2>
      <div id="testimonial-container"></div>
      <button id="add-testimonial">Add Your Testimonial</button>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2025 The YOLO Studio. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
