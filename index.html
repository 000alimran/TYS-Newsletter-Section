<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The YOLO Letter</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">
  <!-- Banner Section -->
  <header class="w-full bg-gradient-to-r from-purple-500 via-pink-500 to-red-500 py-5">
    <div class="container mx-auto text-center">
      <img src="TYS logo bkash logo.png" alt="The YOLO Letter Logo" class="mx-auto h-16 mb-3">
      <h1 class="text-white text-4xl font-bold">The YOLO Letter</h1>
      <p class="text-white text-lg">Stay Updated, Stay Inspired!</p>
    </div>
  </header>

  <!-- Newsletter Form -->
  <section class="mt-10">
    <div class="bg-white p-8 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Subscribe to our Newsletter</h2>
      <form id="newsletterForm" class="flex flex-col space-y-4">
        <input
          type="email"
          id="email"
          class="border rounded-lg p-3 w-full focus:outline-none focus:ring-2 focus:ring-purple-500"
          placeholder="Enter your email"
          required
        />
        <button
          type="submit"
          class="bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition"
        >
          Subscribe
        </button>
      </form>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
